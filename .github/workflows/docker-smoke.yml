name: Docker smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Docker smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [transformers, sglang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          tags: landuse-relevance-bench:smoke
          load: true
          push: false
          build-args: LRB_SOURCE_COMMIT=${{ github.sha }}

      - name: CLI and non-root volume smoke
        env:
          IMAGE: landuse-relevance-bench:smoke
        run: |
          set -euo pipefail
          results_dir="$(mktemp -d)"
          cache_dir="$(mktemp -d)"
          trap 'rm -rf "$results_dir" "$cache_dir"' EXIT
          chmod 777 "$results_dir" "$cache_dir"

          docker run --rm "$IMAGE" --version
          docker run --rm "$IMAGE" models --json >/dev/null
          docker run --rm \
            -v "$results_dir:/app/results" \
            -v "$cache_dir:/cache/huggingface" \
            --entrypoint sh "$IMAGE" -ec '
            test "$(id -u)" -eq 1000
            touch /app/results/.docker-smoke
            touch /cache/huggingface/.docker-smoke
          '
          test "$(stat -c '%u' "$results_dir/.docker-smoke")" = 1000
          test "$(stat -c '%u' "$cache_dir/.docker-smoke")" = 1000

          docker run --rm \
            -v "$PWD/results:/app/results:ro" \
            --entrypoint sh "$IMAGE" -ec '
              lrb report --results-dir /app/results --out /tmp/leaderboard.csv >/dev/null
              test -s /tmp/leaderboard.csv
            '
