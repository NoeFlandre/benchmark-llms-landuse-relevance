name: Docker smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Docker smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [transformers, sglang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          tags: landuse-relevance-bench:smoke
          load: true
          push: false
          build-args: LRB_SOURCE_COMMIT=${{ github.sha }}

      - name: CLI and non-root volume smoke
        env:
          IMAGE: landuse-relevance-bench:smoke
        run: |
          set -euo pipefail
          results_dir="$(mktemp -d)"
          cache_dir="$(mktemp -d)"
          trap 'rm -rf "$results_dir" "$cache_dir"' EXIT
          chmod 777 "$results_dir" "$cache_dir"

          docker run --rm "$IMAGE" --version >/dev/null
          docker run --rm "$IMAGE" models --json >/dev/null
          container_uid="$(docker run --rm --entrypoint sh "$IMAGE" -c 'id -u')"
          test "$container_uid" -ne 0
          docker run --rm \
            -v "$results_dir:/app/results" \
            -v "$cache_dir:/cache/huggingface" \
            -e "EXPECTED_CONTAINER_UID=$container_uid" \
            --entrypoint sh "$IMAGE" -ec '
            test "$(id -u)" -eq "$EXPECTED_CONTAINER_UID"
            touch /app/results/.docker-smoke
            touch /cache/huggingface/.docker-smoke
          '
          test "$(stat -c '%u' "$results_dir/.docker-smoke")" = "$container_uid"
          test "$(stat -c '%u' "$cache_dir/.docker-smoke")" = "$container_uid"
          cp -R tests/fixtures/docker-smoke/. "$results_dir/"

          docker run --rm \
            -v "$results_dir:/app/results:ro" \
            --entrypoint sh "$IMAGE" -ec '
              lrb report --results-dir /app/results --out /tmp/leaderboard.csv >/dev/null
              test -s /tmp/leaderboard.csv
            '
