name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  gauntlet:
    name: Deterministic quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR checkout is a merge commit, so HEAD^1 is the base for the diff below.
          fetch-depth: 2
      - name: Detect documentation-only pull requests
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation means docs/, mkdocs.yml and Markdown files at the repository root. Other
          # Markdown (test goldens, results archives) is read by tests, so it still runs the gauntlet,
          # and so does an empty diff.
          changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          docs_only='^(docs/|mkdocs\.ya?ml$|[^/]+\.md$)'
          if [ -n "$changed" ] && ! grep -Evq "$docs_only" <<< "$changed"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only pull request; skipping the Python gauntlet."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.scope.outputs.run == 'true'
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # gliner2 conflicts with inference (Transformers 4 vs 5); it is tested in isolation on G5K.
      - run: uv sync --extra inference --extra scoring --extra publish
        if: steps.scope.outputs.run == 'true'
      - name: Lint and format
        if: steps.scope.outputs.run == 'true'
        run: make lint
      - name: Types
        if: steps.scope.outputs.run == 'true'
        run: make types
      - name: Unit and property tests with coverage
        if: steps.scope.outputs.run == 'true'
        run: make test
      - name: Acceptance scenarios
        if: steps.scope.outputs.run == 'true'
        run: make acceptance
      - name: Architecture boundaries
        if: steps.scope.outputs.run == 'true'
        run: make architecture
      - name: Grid5000 script tests
        if: steps.scope.outputs.run == 'true'
        run: make scripts
      - name: Built wheel ships py.typed
        if: steps.scope.outputs.run == 'true'
        run: make wheel
      - name: CRAP score
        if: steps.scope.outputs.run == 'true'
        run: make crap -o test
      - name: CLI smoke test
        if: steps.scope.outputs.run == 'true'
        run: make smoke

  mutation:
    name: Mutation gate (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR checkout is a merge commit, so HEAD^1 is the base for the diff below.
          fetch-depth: 2
      - name: Detect changes that can affect mutation results
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Inputs: the paths listed below (mutmut copies them), plus check_mutants.py and
          # the Makefile. Anything else, such as docs/ and other *.md files, skips the run.
          changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          if grep -Eq '^(src|tests|scripts|data|results)/|^(README\.md|CITATION\.cff|pyproject\.toml|uv\.lock|Makefile|mutation-allowlist\.txt|\.github/workflows/ci\.yml)$' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No code changes in this PR; skipping mutation testing."
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: uv sync --extra inference --extra scoring --extra publish
      - name: Mutation testing
        if: steps.scope.outputs.run == 'true'
        run: make mutation

  lockfile:
    name: Lockfile and speculative extra resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Lockfile and SGLang speculative runtime
        run: make lockfile

  docs:
    name: Documentation builds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: make docs-build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: make security

  image:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: LRB_SOURCE_COMMIT=${{ github.sha }}

  all-green:
    name: All green
    if: always()
    needs: [gauntlet, mutation, lockfile, docs, security, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          allowed_skips = {"docs"} if os.environ["EVENT"] != "pull_request" else set()
          bad = {
              name: need["result"]
              for name, need in needs.items()
              if need["result"] != "success"
              and not (need["result"] == "skipped" and name in allowed_skips)
          }
          if bad:
              sys.exit(f"jobs not green: {bad}")
          PY
