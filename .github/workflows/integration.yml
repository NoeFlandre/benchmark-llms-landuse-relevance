name: CPU integration

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiny-transformers-model:
    name: Tiny CPU model smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HOME: ${{ runner.temp }}/huggingface
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra inference
      - name: Run the CPU integration suite
        run: make integration
