name: CPU integration

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiny-transformers-model:
    name: Tiny CPU model smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra inference
      - name: Run the CPU integration suite
        # The runner context is only available at step level.
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: make integration
